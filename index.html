<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Interactive HTML Mockup กิจกรรมที่ 9 ระบบฐานข้อมูลการดำเนินการตามหมายจับ">
  <title>ระบบหมายจับ | E-CMIS</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/arrest-warrant.css">
</head>
<body>
  <a class="skip-link" href="#app-content">ข้ามไปยังเนื้อหาหลัก</a>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
      <div class="sidebar-brand">
        <img src="assets/pacc-logo.webp" alt="ตราสำนักงาน ป.ป.ท." width="44" height="44">
        <div class="brand-copy"><strong>E-CMIS</strong><span>COMPLAINT MANAGEMENT</span></div>
        <button class="icon-button sidebar-close" type="button" data-action="close-sidebar" aria-label="ปิดเมนู">×</button>
      </div>
      <nav id="primary-nav" class="primary-nav" aria-label="เมนูระบบหมายจับ"></nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>
    <div class="sidebar-overlay" data-action="close-sidebar" aria-hidden="true"></div>

    <header class="topbar">
      <button class="icon-button menu-toggle" type="button" data-action="toggle-sidebar" aria-label="เปิดหรือปิดเมนู">☰</button>
      <label class="global-search"><span class="sr-only">ค้นหาใน E-CMIS</span><span aria-hidden="true">⌕</span><input type="search" id="global-search" placeholder="ค้นหาเลขเรื่อง ผู้ถูกร้อง หน่วยงาน..." autocomplete="off"></label>
      <div class="topbar-actions">
        <span class="environment-badge" title="ข้อมูลทั้งหมดเป็นข้อมูลสมมติ">ข้อมูลสมมติสำหรับสาธิต</span>
        <label class="role-switcher"><span class="sr-only">บทบาทผู้ใช้งาน</span><select id="role-select" class="role-select" aria-label="สลับบทบาทผู้ใช้งาน"></select></label>
        <div class="notification-menu">
          <button class="icon-button notification-button" type="button" data-action="open-notifications" aria-label="เปิดการแจ้งเตือน"><svg class="bell-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg><b id="notification-count">0</b></button>
        </div>
        <button class="user-pill" type="button" data-action="toggle-user-menu" aria-expanded="false">
          <span class="user-avatar" id="topbar-avatar">จ</span>
          <span class="user-pill-copy"><strong id="topbar-user-name">เจ้าหน้าที่</strong><small id="topbar-user-role">ผู้ปฏิบัติงาน</small></span>
          <span aria-hidden="true">⌄</span>
        </button>
        <section class="user-popover" id="user-popover" hidden aria-label="ข้อมูลผู้ใช้งานปัจจุบัน"></section>
      </div>
    </header>

    <main id="app-content" class="app-content" tabindex="-1"></main>
  </div>

  <aside id="presenter-drawer" class="presenter-drawer" hidden aria-label="เครื่องมือนำเสนอ"></aside>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <noscript><div class="noscript">Mockup นี้ต้องเปิด JavaScript เพื่อใช้งานกระบวนการ Interactive</div></noscript>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="js/thai-address-data.js" defer></script>
  <script src="js/seed-data.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/state-machine.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/document-preview.js" defer></script>
  <script src="js/presentation-mode.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
